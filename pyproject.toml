[project]
name = "freestream-resolver"
version = "0.1.0"
description = "Scrubs-lineage Kodi plugin port: scrapers, FlareSolverr, hoster resolve"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
freestream-resolve = "freestream_resolver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freestream_resolver"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
