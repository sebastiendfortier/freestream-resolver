name: Test freestream-resolver

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.41.4

      - name: Verify Kodi plugins
        run: pixi run python tools/fetch_kodi_plugins.py --verify

      - name: Unit tests
        run: pixi run python -m pytest tests/ -q
